<!DOCTYPE html>
<html>
<head>
    <base target="_blank">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #menu {
            display: flex;
            flex-direction: column;
            width: 300px;
        }
        #menu a {
            margin-bottom: 10px;
            padding: 15px 25px;
            font: 16px Arial;
            text-decoration: none;
            color: white;
            border: 1px solid #16A177;
            background-color: #16A177;
        }
        #menu a:hover, #menu a.active {
            color: #16A177;
            background-color: white;
        }
    </style>
</head>
<body>
    <div id="menu">
        <a href="#">home</a>
        <a href="#" class="active">blog</a>
        <a href="#">photos</a>
        <a href="#">about us</a>
        <a href="#">contacts</a>
    </div>
</body>
</html>
